name: verify-viewers

# Headless verification of the committed convergence viewers (Idea 1 / CI harness).
# The self-contained HTML viewers are checked into git, so CI can verify them
# WITHOUT re-exporting (no chronogram/trait downloads needed) -- it only needs a
# headless browser. This is the structural guard against "looked done, was broken".

on:
  push:
    paths:
      - "evolve/viewer/*.html"
      - "evolve/viewer/verify_all.py"
      - ".github/workflows/verify-viewers.yml"
  pull_request:
    paths:
      - "evolve/viewer/*.html"
      - "evolve/viewer/verify_all.py"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Playwright + Chromium
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Verify all viewers (strict)
        run: python evolve/viewer/verify_all.py --strict
